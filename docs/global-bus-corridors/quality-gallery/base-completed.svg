fill="#d97706"/></g><g><circle data-type="point" data-label="D5 source [top]" data-x="-4" data-y="0.7249999999999999" cx="430.3225806451613" cy="1070.3548387096776" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="D5 target [top]" data-x="4" data-y="0.5249999999999999" cx="1369.6774193548388" cy="1093.8387096774193" r="3" fill="#d97706"/></g><g><circle data-type="point" data-label="D6 source [top]" data-x="-4" data-y="1.075" cx="430.3225806451613" cy="1029.258064516129" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="D6 target [top]" data-x="4" data-y="0.875" cx="1369.6774193548388" cy="1052.741935483871" r="3" fill="#d97706"/></g><g><circle data-type="point" data-label="D7 source [top]" data-x="-4" data-y="1.4249999999999998" cx="430.3225806451613" cy="988.1612903225807" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="D7 target [top]" data-x="4" data-y="1.2249999999999999" cx="1369.6774193548388" cy="1011.6451612903227" r="3" fill="#d97706"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="1900" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '1900');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":117.41935483870968,"c":0,"e":900,"b":0,"d":-117.41935483870968,"f":1155.483870967742};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
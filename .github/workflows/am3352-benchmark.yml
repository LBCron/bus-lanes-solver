name: Review validated A13 fix controls
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  BUN_JSC_forceRAMSize: '2147483648'
  BUN_JSC_miniVMHeapGrowthFactor: '1.05'
jobs:
  route:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        sample: [control, control-inner1, right, left, above, inner-layers, inner-layers-right, inner-layers-left, inner-layers-above, inner-layers-complete-ca, outer-layers]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aa0c68b66cb0e80d7aa3bc3f11dfd0ce052cc901
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --ignore-scripts
      - name: Retain only freshly completed and validated output
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          bun scripts/benchmark.ts --worker "$SAMPLE" --timeout-seconds 3600 --routes-directory completed
          test -f "completed/$SAMPLE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: completed-${{ matrix.sample }}
          path: completed/
  collect:
    needs: route
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aa0c68b66cb0e80d7aa3bc3f11dfd0ce052cc901
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: completed-*
          merge-multiple: true
          path: completed
      - name: Verify all eleven before exporting review SVGs
        run: |
          cat > gallery.private.ts <<'TS'
          import {loadAm3352Sample,am3352SamplePlacements} from './scripts/am3352-samples'
          import {exportAm3352RoutedSnapshots} from './scripts/snapshot-routed-am3352'
          const candidates=[]
          for(const placement of am3352SamplePlacements){
            const saved=await Bun.file(`completed/${placement.name}.json`).json()
            const {metadata}=await loadAm3352Sample(placement.name)
            candidates.push({metadata,solver:{...saved,getOutput:()=>saved.output}})
          }
          await exportAm3352RoutedSnapshots(candidates,'gallery')
          TS
          bun gallery.private.ts
          python3 - <<'PY'
          import pathlib,gzip,base64,json
          for p in sorted(pathlib.Path('gallery').glob('*.svg')):
            print('GALLERY_JSON='+json.dumps({'name':p.name,'gzipBase64':base64.b64encode(gzip.compress(p.read_bytes())).decode()},separators=(',',':')))
          PY
      - name: Wait for final paired comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for audit_attempt in $(seq 1 180); do
            state=$(gh api repos/tscircuit/bus-lanes-solver/actions/runs/43955037625 --jq '.status')
            if [ "$state" = completed ]; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: am3352-*
          run-id: 43955037625
          github-token: ${{ github.token }}
          path: reports
      - name: Print exact final comparison and reports
        run: |
          cat reports/am3352-comparison/comparison.md
          python3 - <<'PY'
          import pathlib,json
          reports=[]
          for p in sorted(pathlib.Path('reports').rglob('*.json')):
            r=json.loads(p.read_text())
            if 'sample' in r and 'metadata' in r: reports.append(r)
          assert len(reports)==11,len(reports)
          print('PAIRS_JSON='+json.dumps(reports,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validated-controls-and-comparison
          path: |
            gallery/
            reports/

name: AM3352 completed-route images

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_JSC_forceRAMSize: "2147483648"
  BUN_JSC_miniVMHeapGrowthFactor: "1.05"

jobs:
  solve:
    name: Fresh route ${{ matrix.sample }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        sample: [control, control-inner1, right, left, above, inner-layers, inner-layers-right, inner-layers-left, inner-layers-above, inner-layers-complete-ca, outer-layers]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25e4b24df639719050fe9662bdaf5875ac137dde
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --ignore-scripts
      - name: Fresh solve and native validation
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          mkdir -p routes
          bun scripts/benchmark.ts --worker "$SAMPLE" --timeout-seconds 3600 \
            --solver "$PWD/lib/index.ts" --routes-directory routes > "routes/$SAMPLE.report.log"
          bun --eval '
            const sample = process.env.SAMPLE;
            const lines = (await Bun.file(`routes/${sample}.report.log`).text()).split("\n").filter(line => line.startsWith("REPORT "));
            if (lines.length !== 1) throw Error("Missing unique report");
            const report = JSON.parse(lines[0].slice(7));
            if (!report.solved || !report.validation?.valid || !report.inputUnchanged || !report.fixedPowerPreserved)
              throw Error("Fresh route was not accepted");
            if (!(await Bun.file(`routes/${sample}.json`).exists())) throw Error("Missing audited route data");
          '
      - uses: actions/upload-artifact@v4
        with:
          name: review-route-${{ matrix.sample }}
          path: routes/
          if-no-files-found: error
          retention-days: 14

  export:
    name: Validate all eleven and export completed copper
    needs: solve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25e4b24df639719050fe9662bdaf5875ac137dde
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: review-route-*
          path: fresh-routes
          merge-multiple: true
      - name: Existing full-set snapshot acceptance gate
        run: |
          bun --eval '
            import { loadAm3352Sample, am3352SamplePlacements } from "./scripts/am3352-samples.ts";
            import { exportAm3352RoutedSnapshots } from "./scripts/snapshot-routed-am3352.ts";
            const candidates = [];
            for (const placement of am3352SamplePlacements) {
              const { metadata } = await loadAm3352Sample(placement.name);
              const saved = await Bun.file(`fresh-routes/${placement.name}.json`).json();
              candidates.push({ metadata, solver: {
                solved: saved.solved, failed: saved.failed, error: saved.error,
                input: saved.input, traces: saved.traces, getOutput: () => saved.output,
              }});
            }
            await exportAm3352RoutedSnapshots(candidates, "review-images");
          '
      - uses: actions/upload-artifact@v4
        with:
          name: am3352-completed-review-images
          path: review-images/
          if-no-files-found: error
          retention-days: 14

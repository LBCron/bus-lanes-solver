name: Read the repeated A13 fix AM3352 comparison
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait for the completed repeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repeat_attempt in $(seq 1 180); do
            state=$(gh api repos/tscircuit/bus-lanes-solver/actions/runs/43963070700 --jq '.status')
            if [ "$state" = completed ]; then exit 0; fi
            sleep 20
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: am3352-*
          run-id: 43963070700
          github-token: ${{ github.token }}
          path: reports
      - run: |
          python3 - <<'PY'
          import pathlib,json
          rows=[]
          for p in sorted(pathlib.Path('reports').rglob('*.json')):
            r=json.loads(p.read_text())
            if 'sample' not in r or 'metadata' not in r: continue
            rows.append({'sample':r['sample'],'metadata':r['metadata'],'beforeSeconds':r['main']['report']['solveMilliseconds']/1000,'afterSeconds':r['pr']['report']['solveMilliseconds']/1000,'beforeIterations':r['main']['report']['iterations'],'afterIterations':r['pr']['report']['iterations'],'sameValidation':r['main']['report']['validation']==r['pr']['report']['validation']})
          assert len(rows)==11,len(rows)
          print('REPEAT_JSON='+json.dumps(rows,separators=(',',':')))
          PY

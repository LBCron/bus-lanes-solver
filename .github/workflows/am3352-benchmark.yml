name: Read validated A13 fix review artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-controls-and-comparison
          run-id: 43959167575
          github-token: ${{ github.token }}
          path: saved
      - run: |
          python3 - <<'PY'
          import pathlib,json,copy
          rows=[]
          for p in sorted(pathlib.Path('saved/reports').rglob('*.json')):
            r=json.loads(p.read_text())
            if 'sample' not in r or 'metadata' not in r: continue
            row={'sample':r['sample'],'metadata':r['metadata']}
            all_quality=[]
            for ref in ['main','pr']:
              report=r[ref]['report']
              validation=report['validation']
              row[ref]={k:report[k] for k in ['status','solved','solveMilliseconds','iterations','requestedSignals','routedSignals','inputUnchanged','fixedPowerPreserved','inputSha256','error']}
              row[ref]['wallMilliseconds']=r[ref]['wallMilliseconds']
              row[ref]['valid']=validation['valid']
              row[ref]['complete']=validation['complete']
              row[ref]['matched']=validation['matched']
              row[ref]['combinedDrc']=validation['combinedDrc']
              row[ref]['buses']=[{k:b[k] for k in ['busId','skewMm','toleranceMm','matched']} for b in validation['busLengths']]
              row[ref]['pairs']=[{k:b[k] for k in ['busId','skewMm','toleranceMm','matched']} for b in validation['pairLengths']]
              all_quality.append(validation)
            row['identicalValidation']=all_quality[0]==all_quality[1]
            row['qualityKeys']=list(all_quality[0]['quality'])
            row['couplingBefore']={k:v for k,v in all_quality[0]['quality'].items() if 'pair' in k.lower()}
            row['couplingAfter']={k:v for k,v in all_quality[1]['quality'].items() if 'pair' in k.lower()}
            rows.append(row)
          assert len(rows)==11,len(rows)
          print('COMPACT_PAIRS_JSON='+json.dumps(rows,separators=(',',':')))
          print(pathlib.Path('saved/reports/am3352-comparison/comparison.md').read_text())
          PY
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [control, control-inner1, right, left, above, inner-layers, inner-layers-right, inner-layers-left, inner-layers-above, inner-layers-complete-ca, outer-layers]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-controls-and-comparison
          run-id: 43959167575
          github-token: ${{ github.token }}
          path: saved
      - env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          python3 - <<'PY'
          import pathlib,json,base64,gzip,os
          p=pathlib.Path('saved/gallery')/(os.environ['SAMPLE']+'-solved.svg')
          data=base64.b64encode(gzip.compress(p.read_bytes())).decode()
          print('GALLERY_JSON='+json.dumps({'name':p.name,'gzipBase64':data},separators=(',',':')))
          PY

name: Capture missing exact Core runtime packages

on:
  push:
    branches:
      - diagnostics/core-runtime-exact-closure

permissions:
  contents: read

jobs:
  capture:
    name: runtime package (${{ matrix.package_index }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package_index: [18, 19, 20, 21, 22, 23, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Capture one missing runtime package
        env:
          PENDING_ACCESS_PACKAGE_INDEX: ${{ matrix.package_index }}
        run: bun test --timeout 180000 tests/collect-core-public-package-index.test.ts

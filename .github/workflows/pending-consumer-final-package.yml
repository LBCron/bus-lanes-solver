name: Capture final official pending consumer package

on:
  push:
    branches: [diagnostics/pending-consumer-final-package]

permissions:
  contents: read

jobs:
  capture:
    name: Capture public package group ${{ matrix.capture_group }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        capture_group: [0, 1, 2, 3]
    env:
      PENDING_CONSUMER_CAPTURE_GROUP: ${{ matrix.capture_group }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      - name: Capture bounded official public archive and executable identities
        run: bun test tests/collect-final-consumer-package.test.ts

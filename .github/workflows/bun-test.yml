name: test
on: [push, pull_request]

# Cancel superseded runs on the same PR; keep main runs un-cancelled.
concurrency:
  group: bun-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The slowest single file (tests/repros/mt8395-core-full-routing.test.ts)
    # takes ~13.5 min on its own; leave headroom for install and variance.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install

      # Distributes test files across shards by recorded runtime
      # (test-timings.json), same approach as tscircuit-autorouter.
      - name: Generate balanced test plans
        run: bun scripts/generate-balanced-test-plan.ts
        env:
          NODE_COUNT: 6

      # Full-board 11/11 acceptance runs separately on Blacksmith for every PR.
      - name: Run tests for node ${{ matrix.node }}
        run: |
          test_plan=".bun-test-plan/testplans/testplan${{ matrix.node }}.txt"
          if [ ! -f "$test_plan" ]; then
            echo "Test plan not found: $test_plan"
            exit 1
          fi

          mapfile -t test_files < "$test_plan"
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No test files found in: $test_plan"
            exit 1
          fi

          echo "Running ${#test_files[@]} test files from $test_plan"
          bun test "${test_files[@]}" --timeout 120000

      - name: Upload snapshot diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-node${{ matrix.node }}
          if-no-files-found: ignore
          path: |
            **/*.diff.png
            **/*.received.svg
            !node_modules/**

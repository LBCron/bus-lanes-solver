name: Capture current-via drill repro formatting

on:
  push:
    branches:
      - diagnostics/current-via-drill-repro-format

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      - run: bun test --timeout 240000 tests/format-pending-consumer.test.ts

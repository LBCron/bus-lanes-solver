name: Capture pending consumer formatting

on:
  push:
    branches: [diagnostics/pending-consumer-format-runtime]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      - name: Capture canonical formatter bytes only
        run: >-
          bun test --timeout 240000
          tests/format-pending-consumer.test.ts
